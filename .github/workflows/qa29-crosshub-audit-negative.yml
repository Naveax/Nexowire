name: QA29 Cross-Hub Audit Negative Source
on:
  pull_request:
    paths:
      - "test/qa29-rotated-audit-crosshub-negative.test.ts"
      - "docs/QA29_CROSSHUB_ROTATED_AUDIT_NO_GO_617.md"
      - ".github/workflows/qa29-crosshub-audit-negative.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qa29-crosshub-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source-acceptance:
    name: CrossHub audit Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Parent and child source-only audit acceptance
        run: node --test --import tsx test/qa29-elevated-command-audit-provenance.test.ts test/qa29-rotated-audit-crosshub-negative.test.ts
