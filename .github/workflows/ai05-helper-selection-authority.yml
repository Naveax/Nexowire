name: AI-05 Independent Helper Selection Authority
on:
  pull_request:
    paths:
      - '.github/workflows/ai05-helper-selection-authority.yml'
      - 'sql/helper-selection-authority.sql'
      - 'src/security/postgres-helper-selection-authority.ts'
      - 'src/security/protected-helper-selection-transport.ts'
      - 'src/security/protected-helper-selection-service.ts'
      - 'src/security/signed-helper-selection-evidence.ts'
      - 'test/ai05/signed-helper-selection-evidence.test.ts'
      - 'test/ai05/protected-helper-startup-rollback.test.ts'
      - 'src/installer/protected-helper-entrypoints.ts'
      - 'src/security/protected-helper-rollback-guard.ts'
      - 'src/security/protected-helper-services-startup.ts'
      - 'test/ai05/helper-selection-tls-fixture.ts'
      - 'test/ai05/postgres-helper-selection-authority.test.ts'
permissions:
  contents: read
jobs:
  independent-selection:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: nexowire_helper_ci
          POSTGRES_USER: nexowire_helper_ci
          POSTGRES_PASSWORD: fixture-only-not-production
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U nexowire_helper_ci -d nexowire_helper_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - name: Real independent PostgreSQL selection lifecycle
        shell: bash
        env:
          NEXOWIRE_HELPER_SELECTION_PG_FIXTURE: '1'
          NEXOWIRE_HELPER_SELECTION_PG_PORT: ${{ job.services.postgres.ports[5432] }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          node --test --test-reporter=tap --import tsx --test-concurrency=1 test/ai05/postgres-helper-selection-authority.test.ts test/ai05/signed-helper-selection-evidence.test.ts test/ai05/protected-helper-startup-rollback.test.ts | tee "$RUNNER_TEMP/ai05-helper-selection.tap"
          node scripts/ci/assert-tap-summary.mjs "$RUNNER_TEMP/ai05-helper-selection.tap" 9
