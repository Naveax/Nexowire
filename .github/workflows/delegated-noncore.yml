name: Delegated Non-Core Discovery (K13)

on:
  push:
    branches: ["k13/p005-ci-discovery"]

permissions:
  contents: read

concurrency:
  group: k13-discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-discovery:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify the pushed exact HEAD is checked out
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Verify discovery and negative QA contract
        run: >-
          node --test
          test/delegated/k13/p005-main-ci-inventory.test.mjs
          test/delegated/k13/p005-pr-ci-coverage.test.mjs
      - name: Inventory delegated tests absent from current main CI source
        run: node scripts/delegated/k13/p005-main-ci-inventory.mjs .
      - name: Explicitly run omitted roadmap and nested doctor regression tests
        shell: bash
        run: |
          node --test --import tsx --test-reporter=tap --test-concurrency=1 \
            test/delegated/k09/roadmap-evidence.test.mjs \
            test/delegated/k16/environment-doctor-contract.test.ts \
            > "$RUNNER_TEMP/k13-explicit-delegated.tap"
          cat "$RUNNER_TEMP/k13-explicit-delegated.tap"
          grep -Eq '^# tests [1-9][0-9]*$' "$RUNNER_TEMP/k13-explicit-delegated.tap"
          grep -qx '# fail 0' "$RUNNER_TEMP/k13-explicit-delegated.tap"
          grep -qx '# skipped 0' "$RUNNER_TEMP/k13-explicit-delegated.tap"
          grep -qx '# todo 0' "$RUNNER_TEMP/k13-explicit-delegated.tap"
