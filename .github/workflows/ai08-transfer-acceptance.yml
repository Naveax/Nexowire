name: AI-08 Hosted Transfer Acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/ai08-transfer-acceptance.yml'
      - 'scripts/ci/ai08-transfer-acceptance.mjs'
      - 'test/ci/ai08-transfer-acceptance.test.mjs'
      - 'test/mcp/ai07-*transfer*.test.ts'
      - 'test/mcp/ai07-windows-protected-publisher.test.ts'
      - 'src/agent/*transfer*.ts'
      - 'src/security/*transfer*.ts'
      - 'src/security/windows-programdata-acl.ts'
      - 'src/mcp/durable-large-transfer.ts'
      - 'native/windows-transfer-volume-flush.cs'
      - 'sql/*transfer*.sql'
      - 'sql/core-broker-dispatch-authority.sql'
      - 'package-lock.json'

permissions:
  contents: read
  actions: read

jobs:
  publisher:
    name: publisher-windows-${{ matrix.node }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: node --test test/ci/ai08-transfer-acceptance.test.mjs
      - name: Bind receipt to actual job ID
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NX_JOB_NAME: publisher-windows-${{ matrix.node }}
        run: |
          set -euo pipefail
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" --jq '.jobs[] | [.name,.id] | @tsv' | awk -F '\t' -v name="$NX_JOB_NAME" '$1==name {print $2}')
          [[ "$id" =~ ^[0-9]+$ ]]
          echo "NX_JOB_ID=$id" >> "$GITHUB_ENV"
      - name: Execute Windows hosted NTFS and receipt fixtures
        run: node scripts/ci/ai08-transfer-acceptance.mjs publisher
        env:
          NX_EXPECTED_NODE: "${{ matrix.node }}"
          NEXOWIRE_EXPECTED_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai08-transfer-windows-node-${{ matrix.node }}-${{ github.event.pull_request.head.sha }}
          path: ai08-transfer-receipts/
          if-no-files-found: error

  postgres:
    name: postgres-linux-${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    services:
      dispatch-postgres:
        image: postgres:18
        env:
          POSTGRES_DB: nexowire_dispatch_ci
          POSTGRES_USER: nexowire_dispatch_ci
          POSTGRES_PASSWORD: ci-only-not-a-production-credential
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexowire_dispatch_ci -d nexowire_dispatch_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: node --test test/ci/ai08-transfer-acceptance.test.mjs
      - name: Bind receipt to actual job ID
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NX_JOB_NAME: postgres-linux-${{ matrix.node }}
        run: |
          set -euo pipefail
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" --jq '.jobs[] | [.name,.id] | @tsv' | awk -F '\t' -v name="$NX_JOB_NAME" '$1==name {print $2}')
          [[ "$id" =~ ^[0-9]+$ ]]
          echo "NX_JOB_ID=$id" >> "$GITHUB_ENV"
      - name: Execute disposable PostgreSQL authority fixtures
        run: node scripts/ci/ai08-transfer-acceptance.mjs postgres
        env:
          NX_EXPECTED_NODE: "${{ matrix.node }}"
          NEXOWIRE_EXPECTED_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          NEXOWIRE_PG_DISPATCH_INTEGRATION: "1"
          NEXOWIRE_PG_DISPATCH_TEST_PORT: "5432"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai08-transfer-postgres-node-${{ matrix.node }}-${{ github.event.pull_request.head.sha }}
          path: ai08-transfer-receipts/
          if-no-files-found: error
