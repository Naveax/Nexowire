name: Connection v2 Relay QA

on:
  pull_request:
    paths:
      - 'src/relay/**'
      - 'test/relay.test.ts'
      - 'test/relay-resource-budgets.test.ts'
      - '.github/workflows/connection-v2-relay-qa.yml'

permissions:
  contents: read

concurrency:
  group: connection-v2-relay-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  relay-qa:
    name: relay-qa (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Run real relay admission and existing end-to-end negatives
        run: node --test --import tsx test/relay-resource-budgets.test.ts test/relay.test.ts
