name: AI-05 Legacy Machine Rollback Guard
on:
  pull_request:
    paths:
      - '.github/workflows/ai05-machine-rollback-guard.yml'
      - 'src/update/machine-update.ts'
      - 'scripts/ci/ai05-powershell-fixture-probe.mjs'
      - 'test/machine-update-rollback-integrity.test.ts'
      - 'test/machine-update-rollback-listener-identity.test.ts'
      - 'test/machine-update-preflight-no-task-bounce.test.ts'
      - 'test/machine-update-task-plan-fail-closed.test.ts'
      - 'test/machine-update.test.ts'
permissions:
  contents: read
jobs:
  machine-rollback-guard:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - name: Diagnose original and corrected PowerShell child environment
        run: node scripts/ci/ai05-powershell-fixture-probe.mjs
      - name: Exact Windows no-restart and normal forward cutover fixtures
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          tap="$RUNNER_TEMP/ai05-machine-rollback.tap"
          node --test --test-reporter=tap --test-concurrency=1 --import tsx test/machine-update-rollback-integrity.test.ts test/machine-update-rollback-listener-identity.test.ts test/machine-update-preflight-no-task-bounce.test.ts test/machine-update-task-plan-fail-closed.test.ts test/machine-update.test.ts | tee "$tap"
          node --input-type=module -e 'import {readFileSync} from "node:fs"; import {assertTapSummary} from "./scripts/ci/assert-tap-summary.mjs"; const counts=assertTapSummary(readFileSync(process.argv[1],"utf8"),30); if(counts.tests!==30)throw Error("EXACT_COUNT_MISMATCH"); console.log(JSON.stringify(counts));' "$tap"
