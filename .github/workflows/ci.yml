name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # Keep the same checks as npm run check, with separate bounded steps so
      # a stalled Node matrix job identifies which phase did not complete.
      - name: Typecheck Node sources
        timeout-minutes: 10
        run: npm run typecheck
      - name: Check continuation state
        timeout-minutes: 10
        run: npm run continuation:check
      - name: Audit AI Screen launch paths
        timeout-minutes: 10
        run: npm run ai-screen:launch-audit
      - name: Run Node test suite
        timeout-minutes: 15
        run: npm test
      - name: Build Node sources
        timeout-minutes: 10
        run: npm run build

  browser-live:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Build read-only CORE session witness
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/build-windows-core-session-readback.ps1
      - name: Verify CORE kernel session readback without granting authority
        timeout-minutes: 2
        run: node --test --import tsx test/core-native-session-readback.test.ts
      - name: Build native CORE WebAuthn owner-verification component
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/build-windows-core-webauthn.ps1
      - name: Verify WebAuthn signatures and API presence without opening approval UI
        timeout-minutes: 2
        run: node --test --import tsx test/core-webauthn-approval.test.ts
      - name: Build disposable AppContainer kernel diagnostic
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/build-windows-appcontainer-probe-p07.ps1
      - name: Verify fixed AppContainer payload boundaries on disposable Windows runner
        timeout-minutes: 2
        run: node --test --import tsx test/task-os-sandbox-windows-native-p07.test.ts
        env:
          NEXOWIRE_RUN_WINDOWS_APPCONTAINER_DIAGNOSTIC: "1"
      - name: Verify signed runtime manifest and rollback candidate boundaries
        timeout-minutes: 2
        run: node --test --import tsx test/core-runtime-package-manifest.test.ts
      - name: Verify CORE console admission and local consent cancellation
        run: node --test --import tsx --test-concurrency=1 test/core-console-enrollment-policy.test.ts test/core-console-admission.test.ts test/core-console-provider.integration.test.ts test/windows-core-console-native.test.ts test/windows-console-grant.test.ts test/privileged-broker-lifecycle.test.ts
      # These suites use a disposable loopback fixture with injected callbacks;
      # they do not attest an installed elevated Broker or a production CAS.
      - name: Verify Windows Broker admission fixtures
        timeout-minutes: 5
        run: node --import tsx scripts/qa-windows-broker-admission.ts
      - name: Compile native Windows Job guardian
        shell: pwsh
        run: ./scripts/qa-windows-job-build-p11.ps1
      - name: Physical Windows Job Object regressions
        run: node --test --import tsx --test-concurrency=1 test/windows-job-owner.test.ts test/windows-job-helper-trust.test.ts test/windows-job-helper-acl-publisher.test.ts test/windows-job-attestation-spoof.test.ts test/windows-job-duplicate-handle-risk.test.ts test/windows-job-breakaway.test.ts test/windows-job-hostile-nested.test.ts test/windows-job-named-handle-caveat.test.ts test/windows-job-capacity-128.test.ts test/process-manager-tree-cleanup.test.ts test/process-manager.test.ts
      - name: Verify Windows native-agent singleton lease on a real runner
        run: node --test --import tsx test/native-agent-singleton.test.ts
      - name: Verify Windows DPAPI and pre-logon Hub contracts
        timeout-minutes: 15
        run: node --test --import tsx --test-concurrency=1 test/windows-dpapi-secret.test.ts test/protected-secret-files.test.ts test/hub-lifecycle.test.ts
      - name: Verify structured Windows controls
        run: node --test --import tsx test/windows-control.test.ts
        env:
          NEXOWIRE_LIVE_WINDOWS_SERVICE_TEST: "1"
      - name: Verify Windows environment controls
        run: node --test --import tsx test/windows-environment.test.ts
      - name: Verify browser lockfile ownership and bounded Windows cleanup
        run: node --test --import tsx test/browser-session-cleanup.test.ts
      - run: node --test --import tsx test/browser-live.test.ts
      - name: Verify private file-picker adversarial boundaries
        run: node --test --import tsx test/private-desktop-adversarial-acceptance.test.ts
      - name: Verify private worker fails closed outside NexowirePrivate
        run: node --test --import tsx test/private-worker-desktop-attestation.test.ts
      - name: Verify one-shot private shell worker denies owner Default desktop
        run: node --test --import tsx test/private-shell-oneshot-desktop-gate.test.ts
      - run: node --test --import tsx test/durable-process.test.ts
      - name: Verify independent cross-project negative acceptance gates
        run: node --test --import tsx test/qa-final-acceptance-negative.test.ts test/qa-agent-journal-negative.test.ts test/qa-shell-outcome-negative.test.ts test/qa-artifact-integrity-negative.test.ts test/qa-pr-intake-negative.test.ts

  linux-native-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --test --import tsx test/linux-native-agent-live.test.ts
        env:
          NEXOWIRE_LIVE_LINUX_AGENT_TEST: "1"
      - run: node --test --import tsx test/relay-native-agent-live.test.ts
        env:
          NEXOWIRE_LIVE_RELAY_AGENT_TEST: "1"

  wsl2-live:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install real Ubuntu WSL2 distro
        uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          use-cache: "true"
      - run: npm ci
      - run: npm run typecheck
      - name: Verify Nexowire wsl.exec against real WSL2
        run: node --test --import tsx test/wsl-live.test.ts
        env:
          NEXOWIRE_LIVE_WSL_TEST: "1"
          NEXOWIRE_WSL_TEST_DISTRO: Ubuntu-24.04

  security-operational-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Verify HTTPS OIDC scopes and live credential revocation
        run: node --test --import tsx test/security-operational-live.test.ts
        env:
          NEXOWIRE_LIVE_SECURITY_TEST: "1"

  macos-agent-lifecycle-live:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Verify first-party LaunchAgent lifecycle
        run: node --test --import tsx test/native-agent-lifecycle.test.ts test/macos-agent-lifecycle-live.test.ts
        env:
          NEXOWIRE_LIVE_MACOS_AGENT_LIFECYCLE_TEST: "1"
      - name: Verify real macOS native-agent core capabilities
        run: node --test --import tsx test/macos-native-agent-live.test.ts
        env:
          NEXOWIRE_LIVE_MACOS_AGENT_TEST: "1"
      - name: Verify real Keychain stdin write lifecycle
        run: node --test --import tsx test/platform-secret-store.test.ts test/macos-keychain-live.test.ts
        env:
          NEXOWIRE_LIVE_MACOS_KEYCHAIN_TEST: "1"
