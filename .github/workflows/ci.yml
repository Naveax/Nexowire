name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  browser-live:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Verify structured Windows controls
        run: node --test --import tsx test/windows-control.test.ts
      - name: Verify Windows environment controls
        run: node --test --import tsx test/windows-environment.test.ts
      - run: node --test --import tsx test/browser-live.test.ts
      - run: node --test --import tsx test/durable-process.test.ts

  linux-native-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --test --import tsx test/linux-native-agent-live.test.ts
        env:
          NEXOWIRE_LIVE_LINUX_AGENT_TEST: "1"
      - run: node --test --import tsx test/relay-native-agent-live.test.ts
        env:
          NEXOWIRE_LIVE_RELAY_AGENT_TEST: "1"

  wsl2-live:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install real Ubuntu WSL2 distro
        uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          use-cache: "true"
      - run: npm ci
      - run: npm run typecheck
      - name: Verify Nexowire wsl.exec against real WSL2
        run: node --test --import tsx test/wsl-live.test.ts
        env:
          NEXOWIRE_LIVE_WSL_TEST: "1"
          NEXOWIRE_WSL_TEST_DISTRO: Ubuntu-24.04

  security-operational-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Verify HTTPS OIDC scopes and live credential revocation
        run: node --test --import tsx test/security-operational-live.test.ts
        env:
          NEXOWIRE_LIVE_SECURITY_TEST: "1"

  macos-agent-lifecycle-live:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Verify first-party LaunchAgent lifecycle
        run: node --test --import tsx test/native-agent-lifecycle.test.ts test/macos-agent-lifecycle-live.test.ts
        env:
          NEXOWIRE_LIVE_MACOS_AGENT_LIFECYCLE_TEST: "1"
      - name: Verify real macOS native-agent core capabilities
        run: node --test --import tsx test/macos-native-agent-live.test.ts
        env:
          NEXOWIRE_LIVE_MACOS_AGENT_TEST: "1"
      - name: Verify real Keychain stdin write lifecycle
        run: node --test --import tsx test/platform-secret-store.test.ts test/macos-keychain-live.test.ts
        env:
          NEXOWIRE_LIVE_MACOS_KEYCHAIN_TEST: "1"
