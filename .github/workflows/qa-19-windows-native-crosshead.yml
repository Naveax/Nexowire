name: QA19 Windows native provider cross-head

on:
  pull_request:
    branches:
      - fix/03-windows-broker-provider-attestation-20261021

permissions:
  contents: read

jobs:
  qa19-provider-and-fast-exit:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Compile isolated native Windows Job test guardian
        shell: pwsh
        run: ./scripts/build-windows-job-owner.ps1
      - name: Verify independent native provider truth and exact 100-cycle Job drain
        run: node --test --test-concurrency=1 --import tsx test/qa-19-windows-native-provider-crosshead.test.ts test/qa-19-windows-job-hosted-fast-exit.test.ts
