name: QA26 strict protected-tree JSON type witness
on:
  pull_request:
    branches:
      - test/03-709-qa17-qa19-integration-20261022
permissions:
  contents: read
jobs:
  qa26-json-version-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Dependencies (without installation hooks)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: QA26 strictly scoped TEMP JSON version-type reproduction
        run: node --test --import tsx test/p26-743-strict-envelope-version-type-negative.test.ts
      - name: Source typecheck
        run: npm run typecheck
