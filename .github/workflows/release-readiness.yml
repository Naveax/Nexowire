name: Release Readiness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "src/config.ts"
      - "src/version.ts"
      - "src/cli.ts"
      - "src/hub/hub-boot-lifecycle.ts"
      - "src/security/windows-dpapi.ts"
      - "src/security/protected-secret-files.ts"
      - "test/config.test.ts"
      - "test/hub-lifecycle.test.ts"
      - "test/hub-boot-status-legacy-user.test.ts"
      - "test/hub-boot-task-shell-trust.test.ts"
      - "test/hub-boot-root-boundary.test.ts"
      - "test/hub-boot-handoff-transaction.test.ts"
      - "test/hub-boot-startup-trigger-integrity.test.ts"
      - "test/hub-boot-protected-state-gate.test.ts"
      - "test/hub-boot-shared-ancestor-trust.test.ts"
      - "test/hub-boot-uninstall-task-absence.test.ts"
      - "test/hub-boot-staged-activation.test.ts"
      - "test/hub-boot-machine-startup-admission.test.ts"
      - "src/security/windows-machine-startup-admission.ts"
      - "test/hub-boot-hidden-task-visibility.test.ts"
      - "test/windows-unattended-reboot-readiness.test.ts"
      - "test/windows-dpapi-shell-trust.test.ts"
      - "scripts/ci/assert-tap-summary.mjs"
      - "test/windows-dpapi-secret.test.ts"
      - "test/protected-secret-files.test.ts"
      - "test/version.test.ts"
      - "test/release-tag.test.ts"
      - "scripts/check-release-package.ts"
      - "scripts/build-windows-user-bundle.ts"
      - "scripts/windows-shortcut-interop.ts"
      - "scripts/generate-windows-stable-setup.ts"
      - "scripts/smoke-windows-user-setup.ts"
      - "installers/**"
      - "scripts/check-release-tag.ts"
      - "test/windows-user-bundle.test.ts"
      - "test/windows-stable-setup.test.ts"
      - "scripts/generate-release-metadata.ts"
      - "scripts/verify-release-candidate.ts"
      - "test/release-metadata.test.ts"
      - "test/release-candidate-verify.test.ts"
      - "test/release-attestation-policy.test.ts"
      - "test/release-publication-policy.test.ts"
      - "skills/**"
      - "docs/RELEASE.md"
      # Physical CORE preflight and the source-only audit are release gates.
      - "scripts/Read-Nexowire-V109CoreReadiness.ps1"
      - "scripts/ci/v109-experimental-source-audit.mjs"
      - "test/ci/v109-core-readonly-preflight.test.mjs"
      - "test/ci/v109-experimental-source-audit.test.mjs"
      - "test/ci/release-path-coverage.test.mjs"
      # Test execution coverage changes must never bypass release readiness.
      - "scripts/ci/test-inventory.mjs"
      - "scripts/ci/test-execution-plan.mjs"
      - "scripts/ci/test-execution-coverage.mjs"
      - "scripts/ci/portable-root-execution-receipt.mjs"
      - "scripts/ci/pure-import-provenance.mjs"
      - "test/ci/test-inventory.test.mjs"
      - "test/ci/test-execution-plan.test.mjs"
      - "test/ci/test-execution-coverage.test.mjs"
      - "test/ci/portable-root-execution-receipt.test.mjs"
      - "test/ci/pure-import-provenance.test.mjs"
      - ".github/workflows/ci.yml"
      # Windows process ownership is part of packaging acceptance.
      - "src/agent/process-launch-mode.ts"
      - "src/agent/process-manager.ts"
      - "src/agent/windows-job-owner.ts"
      - "native/windows-job-owner.c"
      - "scripts/build-windows-job-owner.ps1"
      - "test/process-manager-tree-cleanup.test.ts"
      - "test/ai05/personal-process-mode.test.ts"
      - "test/windows-job-*.test.ts"
      # The bounded device copy path is covered by release package tests.
      - "src/mcp/cross-device-file-transfer.ts"
      - "src/mcp/create-server.ts"
      - "test/cross-device-file-transfer.test.ts"
      - "test/cross-device-mcp-transfer.e2e.test.ts"
      - "test/delegated/k19/issue588-large-file-acceptance.test.ts"
      - "docs/releases/**"
      - ".github/workflows/release-readiness.yml"
      - ".github/workflows/publish-release.yml"
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  ai08-coverage-reconciliation:
    name: AI-08 exact-head receipt scope (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Assert exact immutable source HEAD
        env:
          NEXOWIRE_EXPECTED_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$NEXOWIRE_EXPECTED_COMMIT_SHA"
      - name: Reject forged approved test execution receipts
        run: node --test test/ci/test-execution-coverage.test.mjs

  ai08-windows-hub-boot-fixtures:
    name: AI-08 Windows Hub Boot source fixtures (Node ${{ matrix.node-version }})
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Run only reviewed Windows source fixtures with exact-head TAP evidence
        env:
          NEXOWIRE_EXPECTED_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: pwsh
        run: |
          @'
          import {spawnSync} from 'node:child_process';
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {readTestInventory} from './scripts/ci/test-inventory.mjs';
          import {assertTapSummary} from './scripts/ci/assert-tap-summary.mjs';
          const baselineReviewed = {
            'test/hub-boot-status-legacy-user.test.ts':'66d93e212bce277217b3a2cbc027251ed7c73c00',
            'test/hub-boot-task-shell-trust.test.ts':'6dc4e0a7da26bf3dc02877174688448d6348822d',
            'test/hub-boot-root-boundary.test.ts':'d6e564dd581e9dce198afc2b94c2c36ebda56a11',
            'test/hub-boot-handoff-transaction.test.ts':'2c700196272174cdfdc84ecc953365d2946d275f',
          };
          // Reviewed together against AI-01 PR #1242 at ebeadc0a; use the
          // complete compatible profile, never mix baseline and new fixtures.
          const startupReviewed = {
            'test/hub-boot-status-legacy-user.test.ts':'800ca3e6bc6b892c26f102ec7f250754cc1372f3',
            'test/hub-boot-task-shell-trust.test.ts':'ce31e6c39b63647c5bb11e579262690694829b12',
            'test/hub-boot-root-boundary.test.ts':'dee621f126f5b132cd0f25de8cb7469df244833c',
            'test/hub-boot-handoff-transaction.test.ts':'8ad2c05bfe6c08ceae3e15792d493099e44ec20d',
            'test/hub-boot-startup-trigger-integrity.test.ts':'61062ecab51d2852c750cccd03fae79f7b45286a',
          };
          if(process.platform!=='win32') throw Error('WINDOWS_FIXTURE_PLATFORM_REQUIRED');
          const {entries,report}=readTestInventory(process.cwd());
          if(report.commitSha!==process.env.NEXOWIRE_EXPECTED_COMMIT_SHA)
            throw Error('WINDOWS_FIXTURE_HEAD_MISMATCH');
          const tracked=new Map(entries.map(e=>[e.path,e.blob]));
          const hasStartup=tracked.has('test/hub-boot-startup-trigger-integrity.test.ts');
          // Independently reviewed on d2696376 and the AI-01 combined candidate.
          // Shared fixtures are identical in both coherent boot profiles.
          const sharedReviewed = {
            'test/hub-boot-protected-state-gate.test.ts':'40994c7a1178b20946b4432c7ff2716f5a074dd1',
            'test/hub-boot-shared-ancestor-trust.test.ts':'5ef2a796bd617c10130ad44ebd88bed22f6f2466',
            'test/hub-boot-uninstall-task-absence.test.ts':'00457b3720774254d62b0cc378286e17bcbd30f2',
            'test/windows-dpapi-shell-trust.test.ts':'638804ff36f66555d220bb0757ce189354703775',
          };
          // #1327 c614956a: staged activation and coordinated-recovery denial
          // change the fixture contract. Select a complete pinned profile; never
          // silently substitute individual current blobs into the older profiles.
          const stagedReviewed = {
            'test/hub-boot-status-legacy-user.test.ts':'800ca3e6bc6b892c26f102ec7f250754cc1372f3',
            'test/hub-boot-task-shell-trust.test.ts':'ce31e6c39b63647c5bb11e579262690694829b12',
            'test/hub-boot-root-boundary.test.ts':'b3d168159456820b5b7e8f8c3b06695732b537b4',
            'test/hub-boot-handoff-transaction.test.ts':'0d9cccd65c58dffd19ce532dd978f22efb2e670d',
            'test/hub-boot-startup-trigger-integrity.test.ts':'61062ecab51d2852c750cccd03fae79f7b45286a',
            'test/hub-boot-protected-state-gate.test.ts':'40994c7a1178b20946b4432c7ff2716f5a074dd1',
            'test/hub-boot-shared-ancestor-trust.test.ts':'7fb4ee2bc47fcc6543b70e0441bb795f7e8759b8',
            'test/hub-boot-uninstall-task-absence.test.ts':'9612d67e0e3042d0c07aa9f8b054203496adbc35',
            'test/windows-dpapi-shell-trust.test.ts':'638804ff36f66555d220bb0757ce189354703775',
            'test/hub-boot-staged-activation.test.ts':'8fd5be6b05550dfe16d8d5f3c24c6a2a072f2933',
            'test/hub-boot-hidden-task-visibility.test.ts':'29bdbe9b57f3889b4ff444c72d747e816545ed2c',
            'test/windows-unattended-reboot-readiness.test.ts':'291b663e099f78bc6391a429b7aa53b1b278f217',
          };
          const canonicalReviewed={...stagedReviewed,'test/hub-boot-machine-startup-admission.test.ts':'21399d24da8ae7ca6b0c0bd994c5109f2b1d3094'};
          const hasStaged=tracked.has('test/hub-boot-staged-activation.test.ts');
          const hasCanonical=tracked.has('test/hub-boot-machine-startup-admission.test.ts');
          if(hasCanonical&&!hasStaged)throw Error('WINDOWS_FIXTURE_CANONICAL_PROFILE_INCOMPLETE');
          const canonicalMinimums={
            'test/hub-boot-status-legacy-user.test.ts':1,
            'test/hub-boot-task-shell-trust.test.ts':5,
            'test/hub-boot-root-boundary.test.ts':11,
            'test/hub-boot-handoff-transaction.test.ts':5,
            'test/hub-boot-startup-trigger-integrity.test.ts':6,
            'test/hub-boot-protected-state-gate.test.ts':3,
            'test/hub-boot-shared-ancestor-trust.test.ts':5,
            'test/hub-boot-uninstall-task-absence.test.ts':2,
            'test/windows-dpapi-shell-trust.test.ts':4,
            'test/hub-boot-staged-activation.test.ts':9,
            'test/hub-boot-hidden-task-visibility.test.ts':5,
            'test/windows-unattended-reboot-readiness.test.ts':7,
            'test/hub-boot-machine-startup-admission.test.ts':6,
          };
          const profileReviewed=hasStartup?startupReviewed:baselineReviewed;
          for(const file of Object.keys(sharedReviewed)){
            if(Object.hasOwn(profileReviewed,file))throw Error('WINDOWS_FIXTURE_DUPLICATE_REVIEW_PATH: '+file);
          }
          const reviewed=hasCanonical?canonicalReviewed:hasStaged?stagedReviewed:{...profileReviewed,...sharedReviewed};
          const reviewProfile=hasCanonical?'AI01_CANONICAL_STARTUP_ADMISSION_4C7FEEA2':hasStaged?'AI01_STAGED_ACTIVATION_C614956A':hasStartup?'AI01_STARTUP_REVIEW_EBEADC0A':'BASELINE_B04BF428';
          const reviewExtension=hasCanonical?'FAIL_CLOSED_NATIVE_ISOLATION_4C7FEEA2':hasStaged?'COORDINATED_RECOVERY_DENIAL_C614956A':'STATE_ACL_UNINSTALL_DPAPI_D2696376';
          const check=(file,blob)=>{
            const bytes=readFileSync(file);
            const actual=createHash('sha1').update('blob '+bytes.length+'\0').update(bytes).digest('hex');
            if(tracked.get(file)!==blob||actual!==blob)
              throw Error('WINDOWS_FIXTURE_REVIEW_REQUIRED: '+file);
          };
          for(const [file,blob] of Object.entries(reviewed))check(file,blob);
          // DPAPI shell-trust performs seven sequential PowerShell calls,
          // each with a production 180-second deadline. The outer runner
          // must not terminate the test before the inner deadlines resolve.
          const fixtureTimeoutMs=file=>file==='test/windows-dpapi-shell-trust.test.ts'
            ?7*180000+60000:90000;
          const files=[];
          for(const [file,blob] of Object.entries(reviewed)){
            check(file,blob);
            const timeoutMs=fixtureTimeoutMs(file);
            const started=Date.now();
            const r=spawnSync(process.execPath,[
              '--test','--test-reporter=tap','--import','tsx','--test-concurrency=1',file,
            ],{encoding:'utf8',timeout:timeoutMs,maxBuffer:2*1024*1024,windowsHide:true});
            if(r.stdout)process.stdout.write(r.stdout);
            if(r.stderr)process.stderr.write(r.stderr);
            // Record only process metadata, never DPAPI input or ciphertext.
            const elapsedMs=Date.now()-started;
            if(r.error||r.status!==0){
              process.stderr.write(JSON.stringify({
                sourceCommitSha:report.commitSha,path:file,
                result:'FAIL',errorCode:r.error?.code??null,
                exitCode:r.status,signal:r.signal,elapsedMs,timeoutMs,
              })+'\n');
              throw Error('WINDOWS_FIXTURE_EXECUTION_FAILED: '+file);
            }
            const minimum=hasStaged?canonicalMinimums[file]:1;
            if(!Number.isSafeInteger(minimum)||minimum<1)throw Error('WINDOWS_FIXTURE_MINIMUM_REQUIRED: '+file);
            const counts=assertTapSummary(r.stdout,minimum);
            files.push({path:file,gitBlobSha:blob,result:'PASS',elapsedMs,timeoutMs,...counts});
          }
          const count=files.length;
          process.stdout.write(JSON.stringify({
            schemaVersion:1,reviewProfile,reviewExtension,sourceCommitSha:report.commitSha,
            sourceManifestSha256:report.manifestSha256,platform:process.platform,
            nodeVersion:process.version,trackedFileCount:entries.length,
            executedFileCount:count,notRunFileCount:entries.length-count,
            statusCounts:{PASS:count,FAIL:0,SKIP:0,NOT_RUN:entries.length-count},
            passedAssertions:files.reduce((n,f)=>n+f.pass,0),
            scope:'EXPLICIT_WINDOWS_SOURCE_FIXTURES_ONLY',
            physicalWindowsAcceptance:'NOT_INFERRED',files,
          })+'\n');
          '@ | node --input-type=module
          if ($LASTEXITCODE -ne 0) { throw 'AI08_WINDOWS_HUB_BOOT_FIXTURE_GATE_FAILED' }

  package:
    needs: [ai08-coverage-reconciliation, ai08-windows-hub-boot-fixtures]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Trigger coverage is release-critical for stable and prerelease tags alike.
      - name: Verify release trigger coverage on all package versions
        run: node --test test/ci/release-path-coverage.test.mjs
      - name: Verify experimental source and deny fake CORE acceptance
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "$version" == '1.0.9-exp.0' ]]; then
            node --test test/ci/v109-experimental-source-audit.test.mjs test/ci/v109-core-readonly-preflight.test.mjs
            node scripts/ci/v109-experimental-source-audit.mjs --json
          elif [[ "$version" == *-exp.* ]]; then
            echo "::error::Unknown experimental candidate: $version"
            exit 1
          else
            echo 'Stable package: experimental source audit not applicable.'
          fi
      - name: Compile native Windows Job guardian
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-windows-job-owner.ps1
      - name: Run full release gate
        if: runner.os == 'Linux'
        run: npm run release:check
      - name: Run cross-platform package smoke
        if: runner.os != 'Linux'
        run: |
          npm run typecheck
          npm run build
          node --import tsx scripts/check-release-package.ts
      - name: Verify Windows native-agent singleton lease
        if: runner.os == 'Windows'
        run: node --test --import tsx test/native-agent-singleton.test.ts
      - name: Verify Windows DPAPI and pre-logon Hub contracts
        if: runner.os == 'Windows'
        timeout-minutes: 15
        run: node --test --import tsx --test-concurrency=1 test/windows-dpapi-secret.test.ts test/protected-secret-files.test.ts test/hub-lifecycle.test.ts
      - name: Verify protected SYSTEM Hub task presence and no-overwrite guards
        if: runner.os == 'Windows'
        timeout-minutes: 7
        run: node --test --import tsx --test-concurrency=1 test/hub-boot-hidden-task-visibility.test.ts test/hub-boot-install-task-absence.test.ts test/hub-boot-status-legacy-user.test.ts test/windows-unattended-reboot-readiness.test.ts test/qa-ci-browser-live-timeout.test.ts
      - name: Verify native Windows PowerShell 5.1 ZIP extraction compatibility
        if: runner.os == 'Windows'
        timeout-minutes: 3
        run: node --test --import tsx test/ci/windows-node-runtime-extraction.test.ts
      - name: Build Windows one-click user bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node --import tsx scripts/build-windows-user-bundle.ts --output-dir release-windows --source-sha "${{ github.sha }}"
      - name: Smoke Windows one-click setup
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: node --import tsx scripts/smoke-windows-user-setup.ts --bundle-dir release-windows
      - name: Verify WAL reuse and restart integrity with the actual Windows payload and bundled Node
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: |
          $journalPayload = Join-Path $env:RUNNER_TEMP ('nexowire-wal-payload-' + [guid]::NewGuid())
          try {
            Expand-Archive -LiteralPath release-windows/Nexowire-Windows-x64.zip -DestinationPath $journalPayload
            $payloadRoot = Join-Path $journalPayload 'Nexowire'
            $env:NEXOWIRE_JOURNAL_TEST_APP_ROOT = Join-Path $payloadRoot 'app'
            $bundledNode = Join-Path $payloadRoot 'runtime/node.exe'
            & $bundledNode --test --test-concurrency=1 dist/test/agent-journal-restart-regression.test.js dist/test/agent-journal-owner-incarnation.test.js dist/test/live-update-startup-acceptance.test.js dist/test/windows-launcher-encoding.test.js
            if ($LASTEXITCODE -ne 0) { throw 'Packaged Windows journal restart regressions failed.' }
          } finally {
            Remove-Item Env:NEXOWIRE_JOURNAL_TEST_APP_ROOT -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $journalPayload -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Reject corrupted download before extraction or launch
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: node --import tsx scripts/smoke-windows-user-setup.ts --bundle-dir release-windows --scenario checksum-mismatch
      - name: Verify published v1.0.7 setup baseline without preinstalled Node or npm
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $stable = Join-Path $env:RUNNER_TEMP 'nexowire-published-v1.0.7'
          gh release download v1.0.7 --repo Naveax/Nexowire --dir $stable --pattern Nexowire-Setup.cmd --pattern Nexowire-Windows-x64.zip --pattern SHA256SUMS-Windows
          if ($LASTEXITCODE -ne 0) { throw 'Published v1.0.7 installer download failed.' }
          node --import tsx scripts/smoke-windows-user-setup.ts --bundle-dir $stable --profile ascii
          if ($LASTEXITCODE -ne 0) { throw 'Published v1.0.7 ASCII clean-profile setup failed.' }
      - name: Verify anonymous public GitHub download with repository bootstrap and Unicode profile
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: |
          $stable = Join-Path $env:RUNNER_TEMP 'nexowire-published-v1.0.7'
          Copy-Item -LiteralPath installers/Nexowire-Setup.cmd -Destination $stable -Force
          Copy-Item -LiteralPath installers/SHA256SUMS-Windows -Destination $stable -Force
          node --import tsx scripts/smoke-windows-user-setup.ts --bundle-dir $stable --download-source github --public-source-sha "${{ github.event.pull_request.head.sha || github.sha }}"
          if ($LASTEXITCODE -ne 0) { throw 'Repository bootstrap Unicode clean-profile setup failed.' }
      - name: Upload Windows user bundle
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: nexowire-windows-${{ github.run_id }}-${{ github.sha }}
          path: |
            release-windows/Nexowire-Windows-x64.zip
            release-windows/Nexowire-Setup.cmd
            release-windows/SHA256SUMS-Windows
          if-no-files-found: error
          retention-days: 14
      - name: Enforce exact tag/package version match
        if: runner.os == 'Linux'
        run: npm run release:tag:check
      - name: Build canonical release tarball
        if: runner.os == 'Linux'
        run: npm pack
      - name: Generate release checksums and manifest
        if: runner.os == 'Linux'
        run: node --import tsx scripts/generate-release-metadata.ts "$(ls -1 nexowire-*.tgz | head -n 1)"
      - name: Generate CycloneDX SBOM
        if: runner.os == 'Linux'
        run: npm sbom --sbom-format cyclonedx > nexowire-sbom.cdx.json
      - name: Independently verify release candidate evidence
        if: runner.os == 'Linux'
        run: node --import tsx scripts/verify-release-candidate.ts "$(ls -1 nexowire-*.tgz | head -n 1)"
      - name: Upload canonical release candidate
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: nexowire-${{ github.run_id }}-${{ github.sha }}
          path: |
            nexowire-*.tgz
            SHA256SUMS
            release-manifest.json
            nexowire-sbom.cdx.json
          if-no-files-found: error
          retention-days: 14

  attest:
    name: Attest tagged release candidate
    if: github.ref_type == 'tag' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download verified release candidate
        uses: actions/download-artifact@v4
        with:
          name: nexowire-${{ github.run_id }}-${{ github.sha }}
          path: release-candidate
      - name: Download Windows user bundle
        uses: actions/download-artifact@v4
        with:
          name: nexowire-windows-${{ github.run_id }}-${{ github.sha }}
          path: release-windows
      - name: Re-check downloaded candidate checksum
        working-directory: release-candidate
        run: sha256sum -c SHA256SUMS
      - name: Re-check Windows user bundle checksums
        working-directory: release-windows
        run: sha256sum -c SHA256SUMS-Windows
      - name: Generate SLSA build provenance attestation
        uses: actions/attest@v4
        with:
          subject-path: "release-candidate/nexowire-*.tgz"
      - name: Generate Windows payload provenance attestation
        uses: actions/attest@v4
        with:
          subject-path: "release-windows/Nexowire-Windows-x64.zip"
      - name: Generate Windows setup provenance attestation
        uses: actions/attest@v4
        with:
          subject-path: "release-windows/Nexowire-Setup.cmd"
      - name: Generate SBOM attestation
        uses: actions/attest@v4
        with:
          subject-path: "release-candidate/nexowire-*.tgz"
          sbom-path: "release-candidate/nexowire-sbom.cdx.json"

  publish:
    name: Publish GitHub Release
    if: github.ref_type == 'tag' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [package, attest]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download verified release candidate
        uses: actions/download-artifact@v4
        with:
          name: nexowire-${{ github.run_id }}-${{ github.sha }}
          path: release-candidate
      - name: Download Windows user bundle
        uses: actions/download-artifact@v4
        with:
          name: nexowire-windows-${{ github.run_id }}-${{ github.sha }}
          path: release-windows
      - name: Re-check release checksum
        working-directory: release-candidate
        run: sha256sum -c SHA256SUMS
      - name: Re-check Windows user bundle checksums
        working-directory: release-windows
        run: sha256sum -c SHA256SUMS-Windows
      - name: Publish GitHub Release
        working-directory: release-candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            nexowire-*.tgz \
            SHA256SUMS \
            release-manifest.json \
            nexowire-sbom.cdx.json \
            ../release-windows/Nexowire-Setup.cmd \
            ../release-windows/Nexowire-Windows-x64.zip \
            ../release-windows/SHA256SUMS-Windows \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "Nexowire ${GITHUB_REF_NAME#v}" \
            --generate-notes

