name: Release Readiness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "src/config.ts"
      - "src/version.ts"
      - "src/cli.ts"
      - "src/hub/hub-boot-lifecycle.ts"
      - "src/security/windows-dpapi.ts"
      - "src/security/protected-secret-files.ts"
      - "test/config.test.ts"
      - "test/hub-lifecycle.test.ts"
      - "test/windows-dpapi-secret.test.ts"
      - "test/protected-secret-files.test.ts"
      - "test/version.test.ts"
      - "test/release-tag.test.ts"
      - "scripts/check-release-package.ts"
      - "scripts/build-windows-user-bundle.ts"
      - "scripts/windows-shortcut-interop.ts"
      - "scripts/generate-windows-stable-setup.ts"
      - "scripts/smoke-windows-user-setup.ts"
      - "installers/**"
      - "scripts/check-release-tag.ts"
      - "test/windows-user-bundle.test.ts"
      - "test/windows-stable-setup.test.ts"
      - "scripts/generate-release-metadata.ts"
      - "scripts/verify-release-candidate.ts"
      - "test/release-metadata.test.ts"
      - "test/release-candidate-verify.test.ts"
      - "test/release-attestation-policy.test.ts"
      - "test/release-publication-policy.test.ts"
      - "skills/**"
      - "docs/RELEASE.md"
      - "docs/releases/**"
      - ".github/workflows/release-readiness.yml"
      - ".github/workflows/publish-release.yml"
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Compile native Windows Job guardian
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-windows-job-owner.ps1
      - name: Run full release gate
        if: runner.os == 'Linux'
        run: npm run release:check
      - name: Run cross-platform package smoke
        if: runner.os != 'Linux'
        run: |
          npm run typecheck
          npm run build
          node --import tsx scripts/check-release-package.ts
      - name: Verify Windows native-agent singleton lease
        if: runner.os == 'Windows'
        run: node --test --import tsx test/native-agent-singleton.test.ts
      - name: Verify Windows DPAPI and pre-logon Hub contracts
        if: runner.os == 'Windows'
        timeout-minutes: 15
        run: node --test --import tsx --test-concurrency=1 test/windows-dpapi-secret.test.ts test/protected-secret-files.test.ts test/hub-lifecycle.test.ts
      - name: Build Windows one-click user bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node --import tsx scripts/build-windows-user-bundle.ts --output-dir release-windows --source-sha "${{ github.sha }}"
      - name: Smoke Windows one-click setup
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: node --import tsx scripts/smoke-windows-user-setup.ts --bundle-dir release-windows
      - name: Verify WAL reuse and restart integrity with the actual Windows payload and bundled Node
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: |
          $journalPayload = Join-Path $env:RUNNER_TEMP ('nexowire-wal-payload-' + [guid]::NewGuid())
          try {
            Expand-Archive -LiteralPath release-windows/Nexowire-Windows-x64.zip -DestinationPath $journalPayload
            $payloadRoot = Join-Path $journalPayload 'Nexowire'
            $env:NEXOWIRE_JOURNAL_TEST_APP_ROOT = Join-Path $payloadRoot 'app'
            $bundledNode = Join-Path $payloadRoot 'runtime/node.exe'
            & $bundledNode --test dist/test/agent-journal-restart-regression.test.js dist/test/live-update-startup-acceptance.test.js
            if ($LASTEXITCODE -ne 0) { throw 'Packaged Windows journal restart regressions failed.' }
          } finally {
            Remove-Item Env:NEXOWIRE_JOURNAL_TEST_APP_ROOT -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $journalPayload -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Reject corrupted download before extraction or launch
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: node --import tsx scripts/smoke-windows-user-setup.ts --bundle-dir release-windows --scenario checksum-mismatch
      - name: Verify published v1.0.7 setup baseline without preinstalled Node or npm
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $stable = Join-Path $env:RUNNER_TEMP 'nexowire-published-v1.0.7'
          gh release download v1.0.7 --repo Naveax/Nexowire --dir $stable --pattern Nexowire-Setup.cmd --pattern Nexowire-Windows-x64.zip --pattern SHA256SUMS-Windows
          if ($LASTEXITCODE -ne 0) { throw 'Published v1.0.7 installer download failed.' }
          node --import tsx scripts/smoke-windows-user-setup.ts --bundle-dir $stable --profile ascii
          if ($LASTEXITCODE -ne 0) { throw 'Published v1.0.7 ASCII clean-profile setup failed.' }
      - name: Verify anonymous public GitHub download with repository bootstrap and Unicode profile
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: |
          $stable = Join-Path $env:RUNNER_TEMP 'nexowire-published-v1.0.7'
          Copy-Item -LiteralPath installers/Nexowire-Setup.cmd -Destination $stable -Force
          Copy-Item -LiteralPath installers/SHA256SUMS-Windows -Destination $stable -Force
          node --import tsx scripts/smoke-windows-user-setup.ts --bundle-dir $stable --download-source github
          if ($LASTEXITCODE -ne 0) { throw 'Repository bootstrap Unicode clean-profile setup failed.' }
      - name: Upload Windows user bundle
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: nexowire-windows-${{ github.run_id }}-${{ github.sha }}
          path: |
            release-windows/Nexowire-Windows-x64.zip
            release-windows/Nexowire-Setup.cmd
            release-windows/SHA256SUMS-Windows
          if-no-files-found: error
          retention-days: 14
      - name: Enforce exact tag/package version match
        if: runner.os == 'Linux'
        run: npm run release:tag:check
      - name: Build canonical release tarball
        if: runner.os == 'Linux'
        run: npm pack
      - name: Generate release checksums and manifest
        if: runner.os == 'Linux'
        run: node --import tsx scripts/generate-release-metadata.ts "$(ls -1 nexowire-*.tgz | head -n 1)"
      - name: Generate CycloneDX SBOM
        if: runner.os == 'Linux'
        run: npm sbom --sbom-format cyclonedx > nexowire-sbom.cdx.json
      - name: Independently verify release candidate evidence
        if: runner.os == 'Linux'
        run: node --import tsx scripts/verify-release-candidate.ts "$(ls -1 nexowire-*.tgz | head -n 1)"
      - name: Upload canonical release candidate
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: nexowire-${{ github.run_id }}-${{ github.sha }}
          path: |
            nexowire-*.tgz
            SHA256SUMS
            release-manifest.json
            nexowire-sbom.cdx.json
          if-no-files-found: error
          retention-days: 14

  attest:
    name: Attest tagged release candidate
    if: github.ref_type == 'tag' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download verified release candidate
        uses: actions/download-artifact@v4
        with:
          name: nexowire-${{ github.run_id }}-${{ github.sha }}
          path: release-candidate
      - name: Download Windows user bundle
        uses: actions/download-artifact@v4
        with:
          name: nexowire-windows-${{ github.run_id }}-${{ github.sha }}
          path: release-windows
      - name: Re-check downloaded candidate checksum
        working-directory: release-candidate
        run: sha256sum -c SHA256SUMS
      - name: Re-check Windows user bundle checksums
        working-directory: release-windows
        run: sha256sum -c SHA256SUMS-Windows
      - name: Generate SLSA build provenance attestation
        uses: actions/attest@v4
        with:
          subject-path: "release-candidate/nexowire-*.tgz"
      - name: Generate Windows payload provenance attestation
        uses: actions/attest@v4
        with:
          subject-path: "release-windows/Nexowire-Windows-x64.zip"
      - name: Generate Windows setup provenance attestation
        uses: actions/attest@v4
        with:
          subject-path: "release-windows/Nexowire-Setup.cmd"
      - name: Generate SBOM attestation
        uses: actions/attest@v4
        with:
          subject-path: "release-candidate/nexowire-*.tgz"
          sbom-path: "release-candidate/nexowire-sbom.cdx.json"

  publish:
    name: Publish GitHub Release
    if: github.ref_type == 'tag' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [package, attest]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download verified release candidate
        uses: actions/download-artifact@v4
        with:
          name: nexowire-${{ github.run_id }}-${{ github.sha }}
          path: release-candidate
      - name: Download Windows user bundle
        uses: actions/download-artifact@v4
        with:
          name: nexowire-windows-${{ github.run_id }}-${{ github.sha }}
          path: release-windows
      - name: Re-check release checksum
        working-directory: release-candidate
        run: sha256sum -c SHA256SUMS
      - name: Re-check Windows user bundle checksums
        working-directory: release-windows
        run: sha256sum -c SHA256SUMS-Windows
      - name: Publish GitHub Release
        working-directory: release-candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            nexowire-*.tgz \
            SHA256SUMS \
            release-manifest.json \
            nexowire-sbom.cdx.json \
            ../release-windows/Nexowire-Setup.cmd \
            ../release-windows/Nexowire-Windows-x64.zip \
            ../release-windows/SHA256SUMS-Windows \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "Nexowire ${GITHUB_REF_NAME#v}" \
            --generate-notes

