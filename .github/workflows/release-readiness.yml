name: Release Readiness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "src/config.ts"
      - "src/version.ts"
      - "src/cli.ts"
      - "test/config.test.ts"
      - "test/version.test.ts"
      - "scripts/check-release-package.ts"
      - "skills/**"
      - ".github/workflows/release-readiness.yml"
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run full release gate
        if: runner.os == 'Linux'
        run: npm run release:check
      - name: Run cross-platform package smoke
        if: runner.os != 'Linux'
        run: |
          npm run typecheck
          npm run build
          node --import tsx scripts/check-release-package.ts
      - name: Build canonical release tarball
        if: runner.os == 'Linux'
        run: npm pack
      - name: Upload canonical release candidate
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: nexowire-${{ github.run_id }}-${{ github.sha }}
          path: nexowire-*.tgz
          if-no-files-found: error
          retention-days: 14
