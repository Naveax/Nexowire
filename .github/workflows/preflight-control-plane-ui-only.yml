name: Preflight Nexowire UI-only release (NO DEPLOY)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexowire-ui-only-preflight
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current reviewed dashboard source
        uses: actions/checkout@v4
        with:
          path: ui-source
          persist-credentials: false

      - name: Checkout observed live-asset source baseline (backend runtime unattested)
        uses: actions/checkout@v4
        with:
          ref: d6bf09a4da37042096427d415782902b97e5e87a
          path: pinned-production
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Stage only Admin Bridge dashboard assets
        shell: bash
        run: |
          set -euo pipefail
          cp ui-source/web/app.js pinned-production/web/app.js
          cp ui-source/web/styles.css pinned-production/web/styles.css

      - name: Ensure live assets still match exact production source bytes
        shell: bash
        run: |
          set -euo pipefail
          node ui-source/scripts/preflight-control-plane-ui-only.mjs pinned-production > ui-only-preflight-manifest.json
          cat ui-only-preflight-manifest.json

      - name: Check staged UI syntax
        run: node --check pinned-production/web/app.js

      - name: Install pinned backend dependencies
        working-directory: pinned-production
        run: npm ci

      - name: Check old Worker source with new UI assets
        working-directory: pinned-production
        run: |
          npm run typecheck
          npm run build

      - name: Confirm no deployment or production migration was run
        shell: bash
        run: |
          set -euo pipefail
          changed_count="$(git -C pinned-production diff --name-only HEAD | wc -l | tr -d ' ')"
          test "$changed_count" -ge 1
          test "$changed_count" -le 2
          git -C pinned-production diff --exit-code HEAD -- cloudflare/worker.js
          git -C pinned-production diff --exit-code HEAD -- cloudflare/migrations
          echo "UI_ONLY_PREFLIGHT=PASS"
          echo "PRODUCTION_DEPLOYMENT_PERFORMED=false"

      - name: Prepare fixed, reviewed two-file UI preview artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ui-preview/web
          cp pinned-production/web/app.js ui-preview/web/app.js
          cp pinned-production/web/styles.css ui-preview/web/styles.css
          cp ui-only-preflight-manifest.json ui-preview/manifest.json
          node -e 'const m=require("./ui-preview/manifest.json"); if(m.backendCommit!=="d6bf09a4da37042096427d415782902b97e5e87a" || m.liveBaselineMatched!==true || m.productionDeploymentPerformed!==false || m.backendRuntimeAttested!==false || m.files.length!==2 || m.files.map(x=>x.path).sort().join(",")!=="web/app.js,web/styles.css") process.exit(1)'
          test "$(find ui-preview -type f | wc -l | tr -d ' ')" = 3

      - name: Upload verified review artifact (NO DEPLOY)
        uses: actions/upload-artifact@v4
        with:
          name: nexowire-ui-only-review
          path: ui-preview/
          if-no-files-found: error
          retention-days: 7
