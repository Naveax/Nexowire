name: Deploy Nexowire Control Plane

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: nexowire-control-plane-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        startsWith(github.event.workflow_run.head_commit.message, 'chore(deploy): publish live updater and Admin Bridge telemetry')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GITHUB_CLIENT_ID: ${{ secrets.NEXOWIRE_GITHUB_CLIENT_ID }}
      GITHUB_CLIENT_SECRET: ${{ secrets.NEXOWIRE_GITHUB_CLIENT_SECRET }}
      NEXOWIRE_SESSION_SECRET: ${{ secrets.NEXOWIRE_SESSION_SECRET }}
      NEXOWIRE_INTERNAL_SERVICE_TOKEN: ${{ secrets.NEXOWIRE_INTERNAL_SERVICE_TOKEN }}
      NEXOWIRE_CONFIG_ENCRYPTION_KEY: ${{ secrets.NEXOWIRE_CONFIG_ENCRYPTION_KEY }}
      NEXOWIRE_AGENT_WS_URL: ${{ vars.NEXOWIRE_AGENT_WS_URL }}
      NEXOWIRE_MCP_RESOURCE_URL: ${{ vars.NEXOWIRE_MCP_RESOURCE_URL }}
      NEXOWIRE_ADMIN_GITHUB_ID: ${{ vars.NEXOWIRE_ADMIN_GITHUB_ID }}
      NEXOWIRE_FREE_CAPACITY_PERCENT: ${{ vars.NEXOWIRE_FREE_CAPACITY_PERCENT }}
      NEXOWIRE_PAID_BILLING_ENABLED: ${{ vars.NEXOWIRE_PAID_BILLING_ENABLED }}
      NEXOWIRE_LEMONSQUEEZY_API_KEY: ${{ secrets.NEXOWIRE_LEMONSQUEEZY_API_KEY }}
      NEXOWIRE_LEMONSQUEEZY_WEBHOOK_SECRET: ${{ secrets.NEXOWIRE_LEMONSQUEEZY_WEBHOOK_SECRET }}
      NEXOWIRE_LEMONSQUEEZY_STORE_ID: ${{ vars.NEXOWIRE_LEMONSQUEEZY_STORE_ID }}
      NEXOWIRE_LEMONSQUEEZY_PLUS_VARIANT_ID: ${{ vars.NEXOWIRE_LEMONSQUEEZY_PLUS_VARIANT_ID }}
      NEXOWIRE_LEMONSQUEEZY_PRO_VARIANT_ID: ${{ vars.NEXOWIRE_LEMONSQUEEZY_PRO_VARIANT_ID }}
      NEXOWIRE_LEMONSQUEEZY_PREPAID_PACKS_JSON: ${{ vars.NEXOWIRE_LEMONSQUEEZY_PREPAID_PACKS_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Nexowire
        run: npm run build

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          required=(
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID
            NEXOWIRE_SESSION_SECRET
            NEXOWIRE_INTERNAL_SERVICE_TOKEN
            NEXOWIRE_CONFIG_ENCRYPTION_KEY
            NEXOWIRE_AGENT_WS_URL
            NEXOWIRE_MCP_RESOURCE_URL
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required GitHub secret/variable: $name"
              exit 1
            fi
          done

          billing=(
            NEXOWIRE_LEMONSQUEEZY_API_KEY
            NEXOWIRE_LEMONSQUEEZY_WEBHOOK_SECRET
            NEXOWIRE_LEMONSQUEEZY_STORE_ID
            NEXOWIRE_LEMONSQUEEZY_PLUS_VARIANT_ID
            NEXOWIRE_LEMONSQUEEZY_PRO_VARIANT_ID
          )
          configured_billing=0
          for name in "${billing[@]}"; do
            if [[ -n "${!name:-}" ]]; then
              configured_billing=$((configured_billing + 1))
            fi
          done
          if [[ "$configured_billing" -ne 0 && "$configured_billing" -ne "${#billing[@]}" ]]; then
            echo "::error::Lemon Squeezy billing configuration must be provided together."
            exit 1
          fi
          if [[ -n "${NEXOWIRE_LEMONSQUEEZY_PREPAID_PACKS_JSON:-}" && "$configured_billing" -ne "${#billing[@]}" ]]; then
            echo "::error::Lemon Squeezy prepaid packs require the base billing configuration."
            exit 1
          fi

      - name: Resolve existing D1 database
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .wrangler

          npx --yes wrangler@4 d1 list --json > .wrangler/d1-list.json
          DB_ID="$(
            node - <<'NODE'
          const fs = require('node:fs');
          const rows = JSON.parse(
            fs.readFileSync('.wrangler/d1-list.json', 'utf8'),
          );
          const row = Array.isArray(rows)
            ? rows.find((entry) =>
                entry && entry.name === 'nexowire-control-plane')
            : undefined;
          process.stdout.write(
            String(row?.uuid ?? row?.id ?? ''),
          );
          NODE
          )"

          if [[ -z "$DB_ID" ]]; then
            echo "::error::The existing nexowire-control-plane D1 database was not found. CI will not create infrastructure automatically; run the protected owner bootstrap first."
            exit 1
          fi

          echo "NEXOWIRE_D1_DATABASE_ID=$DB_ID" >> "$GITHUB_ENV"

      - name: Build production Wrangler config
        run: node scripts/prepare-cloudflare-control-plane.mjs

      - name: Build deployment secrets file
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const required = [
            'NEXOWIRE_SESSION_SECRET',
            'NEXOWIRE_INTERNAL_SERVICE_TOKEN',
            'NEXOWIRE_CONFIG_ENCRYPTION_KEY',
          ];
          const secrets = Object.fromEntries(
            required.map((name) => {
              const value = process.env[name];
              if (!value) {
                throw new Error(name + ' is missing.');
              }
              return [name, value];
            }),
          );
          const githubClientId =
            process.env.GITHUB_CLIENT_ID?.trim();
          const githubClientSecret =
            process.env.GITHUB_CLIENT_SECRET?.trim();
          if (Boolean(githubClientId) !== Boolean(githubClientSecret)) {
            throw new Error(
              'GITHUB_CLIENT_ID and GITHUB_CLIENT_SECRET must be configured together when using environment-backed GitHub OAuth.',
            );
          }
          if (githubClientId && githubClientSecret) {
            secrets.GITHUB_CLIENT_ID = githubClientId;
            secrets.GITHUB_CLIENT_SECRET = githubClientSecret;
          }
          const billingApiKey =
            process.env.NEXOWIRE_LEMONSQUEEZY_API_KEY?.trim();
          const billingWebhookSecret =
            process.env.NEXOWIRE_LEMONSQUEEZY_WEBHOOK_SECRET?.trim();
          if (Boolean(billingApiKey) !== Boolean(billingWebhookSecret)) {
            throw new Error(
              'Lemon Squeezy API key and webhook secret must be configured together.',
            );
          }
          if (billingApiKey && billingWebhookSecret) {
            secrets.NEXOWIRE_LEMONSQUEEZY_API_KEY =
              billingApiKey;
            secrets.NEXOWIRE_LEMONSQUEEZY_WEBHOOK_SECRET =
              billingWebhookSecret;
          }
          fs.mkdirSync('.wrangler', { recursive: true });
          fs.writeFileSync(
            '.wrangler/secrets.json',
            JSON.stringify(secrets),
            { mode: 0o600 },
          );
          NODE

      - name: Apply D1 migrations
        run: >-
          npx --yes wrangler@4 d1 migrations apply
          nexowire-control-plane
          --remote
          --config wrangler.runtime.json

      - name: Deploy Worker and static assets
        run: >-
          npx --yes wrangler@4 deploy
          --config wrangler.runtime.json
          --secrets-file .wrangler/secrets.json
          --strict

      - name: Remove generated secret material
        if: always()
        shell: bash
        run: |
          rm -f .wrangler/secrets.json
          rm -f .wrangler/d1-list.json
          rm -f wrangler.runtime.json
