name: AI-08 Credential Atomicity Acceptance
on:
  pull_request:
    paths:
      - '.github/workflows/ai08-credential-atomicity.yml'
      - 'scripts/ci/ai08-credential-atomicity-receipt.mjs'
      - 'test/ai08/credential-atomicity-live.test.ts'
      - 'src/agent/postgres-broker-dispatch-authority.ts'
      - 'src/agent/broker-dispatch-authority-handler.ts'
      - 'src/agent/broker-external-dispatch-fence.ts'
      - 'src/agent/protected-broker-dispatch-service.ts'
      - 'sql/core-broker-dispatch*.sql'
permissions:
  contents: read
  actions: read
jobs:
  postgres:
    name: credential-atomicity-node-${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    services:
      credential-postgres:
        image: postgres:18
        env:
          POSTGRES_DB: nexowire_dispatch_ci
          POSTGRES_USER: nexowire_dispatch_ci
          POSTGRES_PASSWORD: ci-only-not-a-production-credential
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexowire_dispatch_ci -d nexowire_dispatch_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Bind exact job ID
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NX_JOB_NAME: credential-atomicity-node-${{ matrix.node }}
        run: |
          set -euo pipefail
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" --jq '.jobs[] | [.name,.id] | @tsv' | awk -F '\t' -v name="$NX_JOB_NAME" '$1==name {print $2}')
          [[ "$id" =~ ^[0-9]+$ ]]
          echo "NX_JOB_ID=$id" >> "$GITHUB_ENV"
      - name: Execute credential revoke/commit atomicity
        run: node scripts/ci/ai08-credential-atomicity-receipt.mjs
        env:
          NX_EXPECTED_NODE: "${{ matrix.node }}"
          NEXOWIRE_EXPECTED_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          NEXOWIRE_PG_DISPATCH_INTEGRATION: '1'
          NEXOWIRE_PG_DISPATCH_TEST_PORT: '5432'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai08-credential-atomicity-node-${{ matrix.node }}-${{ github.event.pull_request.head.sha }}
          path: ai08-credential-atomicity-receipts/
          if-no-files-found: error
