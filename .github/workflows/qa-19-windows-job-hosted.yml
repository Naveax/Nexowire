name: QA19 Windows Job hosted regression

on:
  pull_request:
    branches:
      - fix/windows-job-helper-trust-qa-20261018

permissions:
  contents: read

jobs:
  qa19-windows-job:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Build test-only native Windows Job guardian from reviewed source
        shell: pwsh
        run: ./scripts/build-windows-job-owner.ps1
      - name: 100-cycle stdout/stderr exit ordering and PID owner anti-spoof
        run: node --test --test-concurrency=1 --import tsx test/qa-19-windows-job-hosted-fast-exit.test.ts
