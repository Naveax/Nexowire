<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Nexowire'a bağlan</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Nexowire</div>
    <div id="connect-pill" class="pill muted">Hazırlanıyor</div>
  </header>

  <main class="shell connect-shell">
    <section class="hero">
      <div>
        <p class="eyebrow">Nexowire</p>
        <h1>Bu bilgisayarı bağla</h1>
        <p class="subtle">
          Bir kez BAĞLA'ya bas. Kurulum ve güvenli bağlantının geri kalanını Nexowire tamamlar.
        </p>
      </div>
    </section>

    <section class="card connect-card">
      <span class="label">Bu cihaz</span>
      <strong id="device-name">—</strong>
      <small id="platform">Hazırlanıyor</small>

      <div class="connect-copy">
        <h2 id="status-title">Hesap kontrol ediliyor</h2>
        <p id="status-text" class="subtle">
          Gerekirse giriş ekranı otomatik açılır.
        </p>
      </div>

      <button id="approve" class="primary connect-button" disabled>BAĞLA</button>
    </section>

    <section id="error-panel" class="error-panel hidden">
      <strong>Bağlantı tamamlanamadı.</strong>
      <p id="error-message"></p>
    </section>
  </main>

  <script type="module" src="./connect.js"></script>
</body>
</html>
